<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pink October template samples</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 32px; background: #f8edf1; color: #442131; font-family: 'DM Sans', sans-serif; }
    h1 { font: 600 36px 'Bodoni Moda', Georgia, serif; }
    main { display: flex; flex-wrap: wrap; gap: 32px; }
    figure { margin: 0; flex: 1 1 280px; max-width: 540px; }
    img { display: block; width: 100%; height: auto; }
    figcaption { padding: 12px 0; }
  </style>
</head>
<body>
  <h1>Pink October template samples</h1>
  <main>
    <figure><img id="tpl-heart" alt="Heart artwork in the Pink October template"><figcaption>Heart</figcaption></figure>
    <figure><img id="tpl-photo" alt="Procedural portrait in the Pink October template"><figcaption>Photo</figcaption></figure>
  </main>
  <script type="module">
    import { renderStory, ensureStoryFonts } from './js/story.js';
    function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
    function drawHeart(ctx, x, y, scale) {
      ctx.beginPath();
      for (let i = 0; i <= 240; i++) {
        const t = i / 240 * Math.PI * 2;
        const px = x + scale * 16 * Math.sin(t) ** 3;
        const py = y - scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.strokeStyle = '#D34880'; ctx.lineWidth = 12; ctx.lineJoin = 'round'; ctx.stroke();
    }
    const heart = canvas(800, 800);
    drawHeart(heart.getContext('2d'), 400, 360, 18);
    const photo = canvas(800, 1000), ctx = photo.getContext('2d');
    const background = ctx.createLinearGradient(0, 0, 800, 1000);
    background.addColorStop(0, '#D7BFC9'); background.addColorStop(1, '#F8E3DC');
    ctx.fillStyle = background; ctx.fillRect(0, 0, 800, 1000);
    ctx.fillStyle = '#704E5D'; ctx.beginPath(); ctx.ellipse(400, 1000, 290, 400, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#BE897C'; ctx.fillRect(340, 470, 120, 180);
    ctx.fillStyle = '#513940'; ctx.beginPath(); ctx.ellipse(400, 340, 178, 218, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#E8B5A1'; ctx.beginPath(); ctx.ellipse(400, 385, 145, 177, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#513940';
    for (const x of [345, 455]) { ctx.beginPath(); ctx.arc(x, 380, 8, 0, Math.PI * 2); ctx.fill(); }
    ctx.strokeStyle = '#9D625F'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(400, 442, 36, .2, Math.PI - .2); ctx.stroke();
    drawHeart(ctx, 400, 455, 21);
    await ensureStoryFonts();
    for (const [variant, artwork] of [['heart', heart], ['photo', photo]]) {
      document.getElementById(`tpl-${variant}`).src = renderStory(canvas(1080, 1920), { artwork, variant }).toDataURL('image/png');
    }
  </script>
</body>
</html>
